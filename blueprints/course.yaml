title: Course
'@extends':
    type: default
    context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          type: tab
          title: PLUGIN_ADMIN.CONTENT
          fields:
            content:
              ordering@: 100
            header.media_order:
              ordering@: 101
            header.description:
              type: textarea
              label: Description
              toggleable: true
              rows: 3
              placeholder: A short description for this course
              help: 'Short description shown on the course card on the Courses homepage.'
            header.icon:
              type: text
              label: Icon
              toggleable: true
              placeholder: 'tabler/bulb.svg'
              help: 'Tabler icon path for this course (e.g. tabler/bulb.svg). Used in course cards and the sidebar course label.'
            header.image:
              type: pagemediaselect
              label: Card Image
              toggleable: true
              help: 'Image from this page''s media folder to display at the top of the course card on the Courses homepage.'
            header.show_sidebar_image:
              type: toggle
              label: 'Show Card Image in Course Sidebar'
              highlight: 1
              default: 0
              options:
                1: PLUGIN_ADMIN.YES
                0: PLUGIN_ADMIN.NO
              help: 'Show the course card image in the sidebar when browsing within this course. Only applies when a Card Image is selected above.'
            header.instructor:
              type: text
              label: Instructor(s)
              toggleable: true
              placeholder: 'e.g. Jane Smith or Jane Smith & John Doe'
              help: 'Instructor name(s) shown below the description on the course card on the Courses homepage.'
            header.group:
              type: text
              label: Group
              toggleable: true
              placeholder: 'e.g. Current Courses'
              help: 'Shows this course under a heading with this name on the Courses homepage.'
            header.badge_label:
              type: text
              label: Badge Label
              toggleable: true
              placeholder: 'e.g. Coming Soon, New, Archived'
              help: 'Short status badge displayed on the course card below the title. Leave empty to show no badge.'
            header.badge_color:
              type: select
              label: Badge Color
              toggleable: true
              default: default
              options:
                default: Default
                blue: Blue
                green: Green
                yellow: Yellow
                red: Red
                purple: Purple
                plain: Plain
              help: 'Badge color. Matches Helios doc-badge color options.'
            header.keep_my_place:
              type: toggle
              label: Keep My Place
              highlight: 1
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
              help: 'Shows returning readers a "Continue where you left off" box on this course''s Modules page.'
            header.side_box:
              type: textarea
              label: Side Box
              toggleable: true
              rows: 5
              help: 'Markdown shown under the navigation on every page of this course.'

        # the same attribution settings as Grav Open Course Space and Helios Open Reader, shown in the footer of the
        # course's pages
        attribution:
          type: tab
          title: Attribution
          fields:
            header.show_oer_attribution:
              type: toggle
              label: Show OER Attribution Block
              highlight: 1
              default: 0
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
              help: 'The attribution text and license in the footer of every page in this course.'
            header.license:
              type: select
              label: License
              toggleable: true
              default: ''
              options:
                '': 'Not specified'
                'CC BY 4.0': 'CC BY 4.0 – Attribution'
                'CC BY-SA 4.0': 'CC BY-SA 4.0 – Attribution-ShareAlike'
                'CC BY-NC 4.0': 'CC BY-NC 4.0 – Attribution-NonCommercial'
                'CC BY-NC-SA 4.0': 'CC BY-NC-SA 4.0 – Attribution-NonCommercial-ShareAlike'
                'CC BY-ND 4.0': 'CC BY-ND 4.0 – Attribution-NoDerivatives'
                'CC BY-NC-ND 4.0': 'CC BY-NC-ND 4.0 – Attribution-NonCommercial-NoDerivatives'
              help: 'The course''s Creative Commons license.'
            header.license_url:
              type: text
              label: License URL
              toggleable: true
              placeholder: 'e.g. https://creativecommons.org/licenses/by/4.0/'
              help: 'Links the license. Leave empty for no link.'
            header.attribution_text:
              type: textarea
              label: Attribution Text
              toggleable: true
              rows: 3
              placeholder: 'e.g. This course by Jane Smith is licensed under CC BY 4.0.'
              help: 'The full attribution statement. Supports basic HTML.'
