title: Course Page
'@extends':
    type: default
    context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          type: tab
          title: PLUGIN_ADMIN.CONTENT
          fields:
            content:
              ordering@: 100
            header.media_order:
              ordering@: 101
            header.icon:
              type: svgicon
              label: Icon
              toggleable: true
              default_set: tabler
              help: Optional icon displayed in navigation and page header
            header.description:
              type: textarea
              label: Description
              toggleable: true
              rows: 2
              placeholder: A short description for this page
              help: Used in navigation cards and page summaries
            header.badge_label:
              type: text
              label: Badge Label
              toggleable: true
              placeholder: 'e.g. New, Draft, Due Friday'
              help: 'Short status badge displayed on this page''s card. Leave empty to show no badge.'
            header.badge_color:
              type: select
              label: Badge Color
              toggleable: true
              default: default
              options:
                default: Default
                blue: Blue
                green: Green
                yellow: Yellow
                red: Red
                purple: Purple
                plain: Plain
              help: 'Badge color. Matches Helios doc-badge color options.'
